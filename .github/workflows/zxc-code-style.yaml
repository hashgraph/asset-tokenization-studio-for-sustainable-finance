# SPDX-License-Identifier: Apache-2.0
---
name: "ZXC: Code Style"
on:
  workflow_call:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: token-studio-linux-medium
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts keeps dependency install hooks and the husky
      # `prepare` script from running on untrusted pull request code.
      - name: Install Dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint
