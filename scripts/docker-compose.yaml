version: '3.8'

services:
  # PostgreSQL Database for ATS API
  postgres-ats:
    image: postgres:15-alpine
    container_name: green_bonds_postgres_ats
    hostname: postgres-ats
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_ats_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - green_bonds_network

  # PostgreSQL Database for Primary Market API
  postgres-primary-market:
    image: postgres:15-alpine
    container_name: green_bonds_postgres_pm
    hostname: postgres-primary-market
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_pm_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - green_bonds_network

  # PostgreSQL Database for Treasury API
  postgres-treasury:
    image: postgres:15-alpine
    container_name: green_bonds_postgres_treasury
    hostname: postgres-treasury
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_treasury_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - green_bonds_network

  # PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4
    container_name: green_bonds_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    depends_on:
      postgres-ats:
        condition: service_healthy
      postgres-primary-market:
        condition: service_healthy
      postgres-treasury:
        condition: service_healthy
    networks:
      - green_bonds_network

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: green_bonds_rabbitmq
    hostname: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - green_bonds_network

volumes:
  postgres_ats_data:
  postgres_pm_data:
  postgres_treasury_data:

networks:
  green_bonds_network:
    driver: bridge